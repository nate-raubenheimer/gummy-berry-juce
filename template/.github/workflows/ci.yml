name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: mac-release
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGB_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: pluginval
        run: |
          curl -LO "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip"
          unzip -q pluginval_macOS.zip
          VST3="$(find build -name '*.vst3' -path '*Release*' -print -quit)"
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate "$VST3"
      - name: Ship-safety assertion (AUD-89)
        run: scripts/ship-safety-check.sh build

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitize:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan+UBSan)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DGB_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build tests
        run: cmake --build build --target GummyPluginTests
      - name: Run tests under sanitizers
        run: ctest --test-dir build --output-on-failure
