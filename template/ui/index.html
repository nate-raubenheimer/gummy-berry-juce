<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GummyPlugin</title>
  <link rel="stylesheet" href="dist/main.css">
</head>
<body>
  <main class="plugin">
    <header class="plugin-header">
      <h1>GummyPlugin</h1>
      <span class="brand">Marula Music</span>
    </header>

    <section class="controls">
      <div class="control" data-param="gain">
        <label for="gain">Gain</label>
        <input type="range" id="gain" min="0" max="1" step="0.001" value="0.5">
        <output for="gain" id="gain-readout">0.0 dB</output>
      </div>
    </section>
  </main>

  <script src="dist/main.js"></script>
</body>
</html>
